name: mmaudit

on:
  workflow_dispatch:
    inputs:
      budget_usd:
        description: Maximum OpenRouter spend in USD
        required: true
        default: "20"
      fail_on:
        description: Severity that fails the job
        required: true
        default: high
        type: choice
        options: [critical, high, medium, low]
      upload_sarif:
        description: Upload SARIF to code scanning
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "17 3 * * 1"
  pull_request:

permissions:
  contents: read

concurrency:
  group: mmaudit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality and traceability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate code, traceability, and safe local release evidence
        run: make release-local

  scanner-only:
    name: Deterministic scanners
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Pinned action SHAs correspond to the major versions named in each comment.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install hardened Linux sandbox
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends bubblewrap
      - name: Install mmaudit
        run: python -m pip install .
      - name: Prepare scanner-only example configuration
        run: cp mmaudit.example.toml /tmp/mmaudit-scanner.toml
      - name: Run scanner-only audit
        env:
          FAIL_LEVEL: ${{ inputs.fail_on || 'high' }}
        run: >-
          mmaudit scan
          --config /tmp/mmaudit-scanner.toml
          --repo .
          --output .mmaudit
          --skip-codeql
          --fail-on "$FAIL_LEVEL"
          --no-color
      - name: Upload local reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mmaudit-scanner-reports
          path: |
            .mmaudit/latest/audit-report.md
            .mmaudit/latest/final-findings.json
            .mmaudit/latest/scanner-results.json
            .mmaudit/latest/audit-results.sarif
            .mmaudit/latest/maximum_assurance_traceability.json
          if-no-files-found: error
          retention-days: 14

  model-audit:
    name: Multi-model audit
    # Pull requests are scanner-only. This prevents any PR-controlled code,
    # including same-repository PR code, from receiving the provider secret.
    # Manual/scheduled model runs are also restricted to the default branch.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HAS_OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
      HAS_MODEL_BENCHMARK: ${{ vars.MMAUDIT_MODEL_BENCHMARK_MODEL_ID != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        if: env.HAS_OPENROUTER_KEY == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: env.HAS_OPENROUTER_KEY == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install hardened Linux sandbox
        if: env.HAS_OPENROUTER_KEY == 'true'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends bubblewrap
      - name: Explain skipped model audit
        if: env.HAS_OPENROUTER_KEY != 'true'
        run: echo "Model audit skipped because this event has no OpenRouter secret."
      - name: Install mmaudit
        if: env.HAS_OPENROUTER_KEY == 'true'
        run: python -m pip install .
      - name: Validate committed configuration
        if: env.HAS_OPENROUTER_KEY == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          test -f mmaudit.toml
          mmaudit doctor --config mmaudit.toml --repo . --output .mmaudit --allow-code-egress --no-color
          mmaudit models check --config mmaudit.toml
      - name: Run bounded audit
        if: env.HAS_OPENROUTER_KEY == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AUDIT_BUDGET: ${{ inputs.budget_usd || '20' }}
          FAIL_LEVEL: ${{ inputs.fail_on || 'high' }}
        run: >-
          mmaudit run
          --config mmaudit.toml
          --repo .
          --output .mmaudit
          --allow-code-egress
          --require-zdr
          --budget-usd "$AUDIT_BUDGET"
          --fail-on "$FAIL_LEVEL"
          --no-color
      - name: Run configured real-provider model benchmark
        if: >-
          env.HAS_OPENROUTER_KEY == 'true' &&
          env.HAS_MODEL_BENCHMARK == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL_BENCHMARK_ID: ${{ vars.MMAUDIT_MODEL_BENCHMARK_MODEL_ID }}
        run: >-
          mmaudit models benchmark
          --config mmaudit.toml
          --corpus benchmarks/model_corpus/manifest.json
          --model "$MODEL_BENCHMARK_ID"
          --allow-code-egress
          --output .mmaudit/model-benchmark-results.json
          --no-color
      - name: Upload model reports
        if: env.HAS_OPENROUTER_KEY == 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mmaudit-model-reports
          path: |
            .mmaudit/latest/audit-report.md
            .mmaudit/latest/final-findings.json
            .mmaudit/latest/audit-results.sarif
            .mmaudit/model-benchmark-results.json
          if-no-files-found: warn
          retention-days: 14

  upload-sarif:
    name: Upload SARIF
    needs: [scanner-only]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.scanner-only.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.upload_sarif)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: mmaudit-scanner-reports
          path: reports
      - uses: github/codeql-action/upload-sarif@b611370bb5703a7efb587f9d136a52ea24c5c38c # v3
        continue-on-error: true
        with:
          sarif_file: reports/audit-results.sarif
