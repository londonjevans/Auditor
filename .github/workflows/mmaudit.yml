name: mmaudit deterministic CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fail_on:
        description: Severity that fails the deterministic gate
        required: true
        default: high
        type: choice
        options: [critical, high, medium, low]
      upload_sarif:
        description: Upload SARIF where this event has code-scanning permission
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: mmaudit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality and traceability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate code and deterministic tests
        run: make check

  scanner-only:
    name: Deterministic scanner-only audit
    needs: [quality]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sarif_ready: ${{ steps.public_stage.outputs.sarif_ready }}
    steps:
      # Every external action is pinned to an immutable commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Resolve deterministic comparison base
        id: comparison-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && ! "$PUSH_BASE_SHA" =~ ^0+$ ]]; then
            base_sha="$PUSH_BASE_SHA"
          else
            base_sha="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          git rev-parse --verify "${base_sha}^{commit}" >/dev/null
          printf 'sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"
      - name: Restore source-bound deterministic baseline
        id: baseline-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/mmaudit-ci-cache
          key: >-
            mmaudit-ci-${{ runner.os }}-${{ steps.comparison-base.outputs.sha }}-lookup
          restore-keys: |
            mmaudit-ci-${{ runner.os }}-${{ steps.comparison-base.outputs.sha }}-
      - name: Install hardened local isolation
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends bubblewrap
      - name: Install mmaudit
        run: python -m pip install .
      - name: Validate and admit a successful baseline run
        shell: bash
        env:
          BASE_SHA: ${{ steps.comparison-base.outputs.sha }}
        run: |
          set -euo pipefail
          cache_root="$RUNNER_TEMP/mmaudit-ci-cache"
          candidate="$cache_root/run"
          admission_marker="$cache_root/admitted-success-commit"
          required=(
            "$candidate/run-evidence-manifest.json"
            "$candidate/final-findings.json"
            "$candidate/ci-state.json"
            "$admission_marker"
          )
          for path in "${required[@]}"; do
            if [[ ! -f "$path" || -L "$path" ]]; then
              echo "No admissible baseline is available; deterministic analysis will run fresh."
              exit 0
            fi
          done
          if ! cmp --silent -- "$admission_marker" <(printf '%s\n' "$BASE_SHA"); then
            echo "The cached baseline lacks a matching successful gate; running fresh."
            exit 0
          fi
          if ! python - "$candidate" "$BASE_SHA" >/dev/null 2>&1 <<'PY'
          import sys
          from pathlib import Path

          from mmaudit.orchestration.ci import load_ci_baseline_bundle

          load_ci_baseline_bundle(
              Path(sys.argv[1]),
              expected_repository_git_commit=sys.argv[2],
          )
          PY
          then
            echo "The cached baseline failed semantic validation; running fresh."
            exit 0
          fi
          printf 'BASELINE_RUN=%s\n' "$candidate" >> "$GITHUB_ENV"
      - name: Prepare scanner-only configuration
        run: cp mmaudit.example.toml /tmp/mmaudit-scanner.toml
      - name: Create fresh runner-temporary output root
        shell: bash
        run: |
          set -euo pipefail
          output_root="$(mktemp -d "$RUNNER_TEMP/mmaudit-output.XXXXXX")"
          chmod 700 "$output_root"
          canonical_root="$(realpath -- "$output_root")"
          case "$canonical_root" in
            "$RUNNER_TEMP"/*) ;;
            *)
              echo "The CI output root escaped RUNNER_TEMP."
              exit 70
              ;;
          esac
          printf 'MMAUDIT_OUTPUT_ROOT=%s\n' "$canonical_root" >> "$GITHUB_ENV"
      - name: Run scanner-only CI audit and capture its gate
        shell: bash
        env:
          BASE_SHA: ${{ steps.comparison-base.outputs.sha }}
          FAIL_LEVEL: ${{ inputs.fail_on || 'high' }}
        run: |
          set -uo pipefail
          args=(
            --config /tmp/mmaudit-scanner.toml
            --repo .
            --output "$MMAUDIT_OUTPUT_ROOT"
            --changed-since "$BASE_SHA"
            --skip-codeql
            --fail-on "$FAIL_LEVEL"
            --no-color
          )
          if [[ -n "${BASELINE_RUN:-}" ]]; then
            args+=(--baseline-run "$BASELINE_RUN")
          fi
          set +e
          env \
            -u GITHUB_ENV \
            -u GITHUB_OUTPUT \
            -u GITHUB_PATH \
            -u GITHUB_STEP_SUMMARY \
            mmaudit ci "${args[@]}"
          audit_exit=$?
          set -e
          printf 'MMAUDIT_AUDIT_EXIT=%s\n' "$audit_exit" >> "$GITHUB_ENV"
          exit 0
      - name: Locate emitted run without accepting ambiguity
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          run_dirs=()
          if [[ -d "$MMAUDIT_OUTPUT_ROOT/runs" ]]; then
            while IFS= read -r -d '' path; do
              run_dirs+=("$path")
            done < <(
              find "$MMAUDIT_OUTPUT_ROOT/runs" \
                -mindepth 1 -maxdepth 1 -type d -print0
            )
          fi
          if [[ "${#run_dirs[@]}" -ne 1 || -L "${run_dirs[0]:-}" ]]; then
            printf 'MMAUDIT_RUN_DISCOVERY_EXIT=70\n' >> "$GITHUB_ENV"
            exit 0
          fi
          run_dir="$(realpath -- "${run_dirs[0]}")"
          canonical_runs="$(realpath -- "$MMAUDIT_OUTPUT_ROOT/runs")"
          case "$run_dir" in
            "$canonical_runs"/*) ;;
            *)
              printf 'MMAUDIT_RUN_DISCOVERY_EXIT=70\n' >> "$GITHUB_ENV"
              exit 0
              ;;
          esac
          printf 'MMAUDIT_RUN_DIR=%s\n' "$run_dir" >> "$GITHUB_ENV"
          printf 'MMAUDIT_RUN_DISCOVERY_EXIT=0\n' >> "$GITHUB_ENV"
      - name: Observe emitted public artifacts
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [[ -z "${MMAUDIT_RUN_DIR:-}" ]]; then
            printf 'MMAUDIT_ARTIFACT_EXIT=70\n' >> "$GITHUB_ENV"
            exit 0
          fi
          set +e
          env \
            -u GITHUB_ENV \
            -u GITHUB_OUTPUT \
            -u GITHUB_PATH \
            -u GITHUB_STEP_SUMMARY \
            python scripts/validate_release_evidence.py \
            --artifact-only \
            --run-dir "$MMAUDIT_RUN_DIR" \
            --artifact-evidence-output \
              "$RUNNER_TEMP/mmaudit-release-artifact-evidence.json"
          artifact_exit=$?
          set -e
          printf 'MMAUDIT_ARTIFACT_EXIT=%s\n' "$artifact_exit" >> "$GITHUB_ENV"
      - name: Verify emitted deterministic evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [[ -z "${MMAUDIT_RUN_DIR:-}" ]]; then
            printf 'MMAUDIT_INTEGRITY_EXIT=70\n' >> "$GITHUB_ENV"
            exit 0
          fi
          required=(
            "$MMAUDIT_RUN_DIR/run-evidence-manifest.json"
            "$MMAUDIT_RUN_DIR/final-findings.json"
            "$MMAUDIT_RUN_DIR/ci-state.json"
          )
          for path in "${required[@]}"; do
            if [[ ! -f "$path" || -L "$path" ]]; then
              printf 'MMAUDIT_INTEGRITY_EXIT=70\n' >> "$GITHUB_ENV"
              exit 0
            fi
          done
          set +e
          env \
            -u GITHUB_ENV \
            -u GITHUB_OUTPUT \
            -u GITHUB_PATH \
            -u GITHUB_STEP_SUMMARY \
            mmaudit verify-run \
            --manifest "$MMAUDIT_RUN_DIR/run-evidence-manifest.json" \
            --run-dir "$MMAUDIT_RUN_DIR" \
            --repo . \
            --output "$RUNNER_TEMP/mmaudit-ci-run-verification.json" \
            --no-color
          integrity_exit=$?
          set -e
          printf 'MMAUDIT_INTEGRITY_EXIT=%s\n' "$integrity_exit" >> "$GITHUB_ENV"
      - name: Stage exact manifest-bound public evidence
        id: public_stage
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          printf 'sarif_ready=false\n' >> "$GITHUB_OUTPUT"
          discovery_exit="${MMAUDIT_RUN_DISCOVERY_EXIT:-70}"
          artifact_exit="${MMAUDIT_ARTIFACT_EXIT:-70}"
          integrity_exit="${MMAUDIT_INTEGRITY_EXIT:-70}"
          if [[ "$discovery_exit" -ne 0 || "$artifact_exit" -ne 0 ||
                "$integrity_exit" -ne 0 || -z "${MMAUDIT_RUN_DIR:-}" ]]; then
            printf 'MMAUDIT_PUBLIC_STAGE_EXIT=70\n' >> "$GITHUB_ENV"
            exit 0
          fi
          public_root="$RUNNER_TEMP/mmaudit-public-evidence"
          set +e
          python - "$MMAUDIT_RUN_DIR" "$public_root" <<'PY'
          import hashlib
          import json
          import os
          import stat
          import sys
          from pathlib import Path

          from mmaudit.orchestration.manifest import load_run_evidence_manifest

          source_root = Path(sys.argv[1]).resolve(strict=True)
          destination_root = Path(sys.argv[2])
          required_public_names = frozenset({
              "audit-results.sarif",
              "client-report.md",
              "coverage.json",
              "ci-state.json",
              "final-findings.json",
              "findings.json",
              "forensic-report.md",
              "maximum_assurance_traceability.json",
              "model-execution.json",
              "scanner-results.json",
          })
          public_artifact_allowlist = frozenset({
              "audit-report.md",
              "audit-results.sarif",
              "benchmark-certificate-verification.json",
              "candidate-findings.json",
              "ci-state.json",
              "client-report.md",
              "context-manifest.json",
              "coverage.json",
              "cross-examination.json",
              "dependency-preparation.json",
              "dependency-sbom.json",
              "economic-simulation-plan.json",
              "execution-origin-dispositions.json",
              "final-findings.json",
              "findings.json",
              "forensic-report.md",
              "formal-results.json",
              "invariant-execution-results.json",
              "invariant-harness-plan.json",
              "invariant-review.json",
              "maximum_assurance_traceability.json",
              "metadata.json",
              "model-execution.json",
              "model-qualification-runtime.json",
              "model-review-coverage.json",
              "model-validation.json",
              "privacy-fork-rpc-egress.json",
              "privacy-policy.json",
              "privacy-source-provenance.json",
              "prior-audit-comparison.json",
              "property-corpus.json",
              "repository-map.json",
              "repository-suite-differential.json",
              "reproduction-results.json",
              "scanner-results.json",
              "scheduler-state.json",
              "scope-assessment.json",
              "solidity-compilation.json",
              "solidity-coverage.json",
              "solidity-graphs.json",
              "solidity-index.json",
              "solidity-invariants.json",
              "solidity-projects.json",
              "solidity-shards.json",
              "specialist-execution.json",
              "verification-results.json",
          })
          prohibited_artifact_prefixes = ("logs/", "private/")
          source_manifest_name = "run-evidence-manifest.json"
          subset_manifest_name = "public-evidence-subset-manifest.json"
          manifest = load_run_evidence_manifest(
              source_root / source_manifest_name
          )
          bindings = {binding.path: binding for binding in manifest.artifacts}
          if destination_root.exists() or destination_root.is_symlink():
              raise ValueError("public staging root already exists")
          run_destination = destination_root / "run"
          run_destination.mkdir(parents=True, mode=0o700)

          def read_exact_bound_file(name: str) -> bytes:
              source = source_root / name
              if name == source_manifest_name:
                  if source.is_symlink() or not source.is_file():
                      raise ValueError("manifest is not a regular non-link file")
                  data = source.read_bytes()
                  return data
              binding = bindings.get(name)
              if binding is None or "/" in name:
                  raise ValueError(f"public artifact is not manifest-bound: {name}")
              descriptor = os.open(source, os.O_RDONLY | os.O_NOFOLLOW)
              try:
                  opened = os.fstat(descriptor)
                  if not stat.S_ISREG(opened.st_mode) or opened.st_nlink != 1:
                      raise ValueError(f"public artifact is not a unique regular file: {name}")
                  with os.fdopen(descriptor, "rb", closefd=False) as handle:
                      data = handle.read(binding.size + 1)
              finally:
                  os.close(descriptor)
              if (
                  len(data) != binding.size
                  or hashlib.sha256(data).hexdigest() != binding.sha256
              ):
                  raise ValueError(f"public artifact differs from its manifest: {name}")
              return data

          omitted_prohibited = sorted(
              name
              for name in bindings
              if name.startswith(prohibited_artifact_prefixes)
          )
          unexpected_nested = sorted(
              name
              for name in bindings
              if "/" in name and not name.startswith(prohibited_artifact_prefixes)
          )
          if unexpected_nested:
              raise ValueError(
                  "manifest contains unclassified nested public artifacts: "
                  + ", ".join(unexpected_nested)
              )
          unclassified_public = sorted(
              name
              for name in bindings
              if "/" not in name and name not in public_artifact_allowlist
          )
          if unclassified_public:
              raise ValueError(
                  "manifest contains non-allowlisted public artifacts: "
                  + ", ".join(unclassified_public)
              )
          public_names = set(bindings) & public_artifact_allowlist
          missing_required = sorted(required_public_names - public_names)
          if missing_required:
              raise ValueError(
                  "manifest omits required public artifacts: " + ", ".join(missing_required)
              )

          copied: dict[str, dict[str, object]] = {}
          for name in sorted(public_names):
              data = read_exact_bound_file(name)
              destination = run_destination / name
              destination.write_bytes(data)
              destination.chmod(0o600)
              copied[name] = {
                  "path": name,
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "size": len(data),
              }
          source_manifest_data = read_exact_bound_file(source_manifest_name)
          source_manifest_destination = run_destination / source_manifest_name
          source_manifest_destination.write_bytes(source_manifest_data)
          source_manifest_destination.chmod(0o600)
          copied[source_manifest_name] = {
              "path": source_manifest_name,
              "sha256": hashlib.sha256(source_manifest_data).hexdigest(),
              "size": len(source_manifest_data),
          }

          def canonical_sha256(value: object) -> str:
              encoded = json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
                  allow_nan=False,
              ).encode()
              return hashlib.sha256(encoded).hexdigest()

          artifact_inventory = [copied[name] for name in sorted(copied)]
          subset_payload = {
              "schema_version": "1.0",
              "bundle_kind": "NON_FORENSIC_PUBLIC_SUBSET",
              "forensic_bundle_complete": False,
              "run_id": manifest.run_id,
              "source_manifest_path": source_manifest_name,
              "source_manifest_file_sha256": copied[source_manifest_name]["sha256"],
              "source_manifest_sha256": manifest.manifest_sha256,
              "artifact_inventory_sha256": canonical_sha256(artifact_inventory),
              "artifacts": artifact_inventory,
              "omitted_artifact_classes": ["logs/**", "private/**"],
              "omitted_prohibited_artifact_count": len(omitted_prohibited),
          }
          subset_manifest = {
              **subset_payload,
              "subset_manifest_sha256": canonical_sha256(subset_payload),
          }
          subset_path = run_destination / subset_manifest_name
          subset_path.write_text(
              json.dumps(subset_manifest, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          subset_path.chmod(0o600)

          # Verify the exact downloadable directory rather than trusting successful copies.
          reloaded_subset = json.loads(subset_path.read_text(encoding="utf-8"))
          observed_subset_hash = reloaded_subset.pop("subset_manifest_sha256", None)
          if observed_subset_hash != canonical_sha256(reloaded_subset):
              raise ValueError("public subset manifest self-hash is invalid")
          if (
              reloaded_subset.get("bundle_kind") != "NON_FORENSIC_PUBLIC_SUBSET"
              or reloaded_subset.get("forensic_bundle_complete") is not False
          ):
              raise ValueError("public subset manifest overstates forensic completeness")
          expected_files = {entry["path"] for entry in artifact_inventory} | {
              subset_manifest_name
          }
          observed_files = {
              path.name for path in run_destination.iterdir() if path.is_file()
          }
          if observed_files != expected_files:
              raise ValueError("downloadable public artifact inventory is incomplete")
          for entry in artifact_inventory:
              name = str(entry["path"])
              if name.startswith(prohibited_artifact_prefixes) or "/" in name:
                  raise ValueError("public subset contains a prohibited artifact")
              data = (run_destination / name).read_bytes()
              if (
                  len(data) != entry["size"]
                  or hashlib.sha256(data).hexdigest() != entry["sha256"]
              ):
                  raise ValueError("public subset artifact failed verification")

          sarif = json.loads(
              (run_destination / "audit-results.sarif").read_text(encoding="utf-8")
          )
          if (
              not isinstance(sarif, dict)
              or sarif.get("version") != "2.1.0"
              or not isinstance(sarif.get("runs"), list)
          ):
              raise ValueError("manifest-bound SARIF failed structural validation")
          marker = {
              "schema_version": "1.0",
              "run_id": manifest.run_id,
              "manifest_sha256": manifest.manifest_sha256,
              "public_subset_manifest_sha256": subset_manifest["subset_manifest_sha256"],
              "sarif_sha256": copied["audit-results.sarif"]["sha256"],
          }
          marker_path = destination_root / "validated-sarif.json"
          marker_path.write_text(
              json.dumps(marker, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          marker_path.chmod(0o600)
          PY
          public_stage_exit=$?
          set -e
          printf 'MMAUDIT_PUBLIC_STAGE_EXIT=%s\n' \
            "$public_stage_exit" >> "$GITHUB_ENV"
          if [[ "$public_stage_exit" -eq 0 ]]; then
            printf 'sarif_ready=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Stage admissible public baseline bundle
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          audit_exit="${MMAUDIT_AUDIT_EXIT:-70}"
          discovery_exit="${MMAUDIT_RUN_DISCOVERY_EXIT:-70}"
          artifact_exit="${MMAUDIT_ARTIFACT_EXIT:-70}"
          integrity_exit="${MMAUDIT_INTEGRITY_EXIT:-70}"
          public_stage_exit="${MMAUDIT_PUBLIC_STAGE_EXIT:-70}"
          cache_admission_exit=0
          if [[ "$audit_exit" -eq 0 && "$discovery_exit" -eq 0 &&
                "$artifact_exit" -eq 0 && "$integrity_exit" -eq 0 &&
                "$public_stage_exit" -eq 0 ]]; then
            set +e
            python - "$MMAUDIT_RUN_DIR" "$GITHUB_SHA" >/dev/null 2>&1 <<'PY'
          import sys
          from pathlib import Path

          from mmaudit.orchestration.ci import load_ci_baseline

          load_ci_baseline(
              Path(sys.argv[1]),
              expected_repository_git_commit=sys.argv[2],
          )
          PY
            cache_admission_exit=$?
            set -e
            if [[ "$cache_admission_exit" -eq 0 ]]; then
              cache_root="$RUNNER_TEMP/mmaudit-ci-cache"
              staged_cache="$(mktemp -d "$RUNNER_TEMP/mmaudit-ci-next-cache.XXXXXX")"
              mkdir "$staged_cache/run"
              for name in \
                run-evidence-manifest.json \
                final-findings.json \
                ci-state.json
              do
                cp --no-dereference --preserve=mode,timestamps \
                  "$MMAUDIT_RUN_DIR/$name" "$staged_cache/run/$name"
              done
              set +e
              python - "$staged_cache/run" "$GITHUB_SHA" >/dev/null 2>&1 <<'PY'
          import sys
          from pathlib import Path

          from mmaudit.orchestration.ci import load_ci_baseline_bundle

          load_ci_baseline_bundle(
              Path(sys.argv[1]),
              expected_repository_git_commit=sys.argv[2],
          )
          PY
              bundle_exit=$?
              set -e
              if [[ "$bundle_exit" -ne 0 ]]; then
                cache_admission_exit="$bundle_exit"
              else
                printf '%s\n' "$GITHUB_SHA" > "$staged_cache/admitted-success-commit"
                if [[ -e "$cache_root" ]]; then
                  mv -- "$cache_root" "$RUNNER_TEMP/mmaudit-ci-consumed-baseline"
                fi
                mv -- "$staged_cache" "$cache_root"
                printf 'MMAUDIT_CACHE_READY=true\n' >> "$GITHUB_ENV"
              fi
            fi
          fi
          printf 'MMAUDIT_CACHE_ADMISSION_EXIT=%s\n' \
            "$cache_admission_exit" >> "$GITHUB_ENV"
      - name: Upload public scanner evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mmaudit-scanner-reports
          path: ${{ runner.temp }}/mmaudit-public-evidence
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Propagate deterministic audit and evidence gates
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          audit_exit="${MMAUDIT_AUDIT_EXIT:-70}"
          discovery_exit="${MMAUDIT_RUN_DISCOVERY_EXIT:-70}"
          artifact_exit="${MMAUDIT_ARTIFACT_EXIT:-70}"
          integrity_exit="${MMAUDIT_INTEGRITY_EXIT:-70}"
          public_stage_exit="${MMAUDIT_PUBLIC_STAGE_EXIT:-70}"
          cache_admission_exit="${MMAUDIT_CACHE_ADMISSION_EXIT:-70}"
          if [[ "$discovery_exit" -ne 0 || "$artifact_exit" -ne 0 ||
                "$integrity_exit" -ne 0 || "$public_stage_exit" -ne 0 ||
                "$cache_admission_exit" -ne 0 ]]; then
            echo "mmaudit evidence validation did not complete; failing closed."
            exit 70
          fi
          exit "$audit_exit"
      - name: Save validated default-branch run candidate
        if: >-
          success() &&
          needs.quality.result == 'success' &&
          github.event_name == 'push' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          env.MMAUDIT_AUDIT_EXIT == '0' &&
          env.MMAUDIT_RUN_DISCOVERY_EXIT == '0' &&
          env.MMAUDIT_ARTIFACT_EXIT == '0' &&
          env.MMAUDIT_INTEGRITY_EXIT == '0' &&
          env.MMAUDIT_PUBLIC_STAGE_EXIT == '0' &&
          env.MMAUDIT_CACHE_ADMISSION_EXIT == '0' &&
          env.MMAUDIT_CACHE_READY == 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/mmaudit-ci-cache
          key: mmaudit-ci-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}

  upload-sarif:
    name: Upload SARIF where permitted
    needs: [scanner-only]
    if: >-
      always() &&
      needs.scanner-only.result != 'cancelled' &&
      needs.scanner-only.outputs.sarif_ready == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.upload_sarif) &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: mmaudit-scanner-reports
          path: reports
      - uses: github/codeql-action/upload-sarif@b611370bb5703a7efb587f9d136a52ea24c5c38c # v3
        continue-on-error: true
        with:
          sarif_file: reports/run/audit-results.sarif
          category: mmaudit-deterministic
