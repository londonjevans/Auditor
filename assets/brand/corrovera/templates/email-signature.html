<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Corrovera Security email signature</title>
  </head>
  <body>
    <!--
      Replace the brace-delimited fields and host the logo at the final HTTPS URL before use.
      Table layout and inline styles are intentional for broad email-client compatibility.
    -->
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      style="border-collapse: collapse; color: #0d2030; font-family: Arial, sans-serif"
    >
      <tr>
        <td style="border-right: 2px solid #2ce0c2; padding: 2px 18px 2px 0">
          <img
            src="https://corrovera.com/brand/corrovera-mark-transparent-512.png"
            width="54"
            height="54"
            alt="Corrovera Security"
            style="border: 0; display: block; height: 54px; width: 54px"
          >
        </td>
        <td style="padding-left: 18px">
          <div style="font-size: 16px; font-weight: 700; letter-spacing: 0.02em">
            {FULL_NAME}
          </div>
          <div style="color: #365163; font-size: 13px; line-height: 20px">
            {ROLE} · Corrovera Security
          </div>
          <div style="font-family: Consolas, monospace; font-size: 12px; line-height: 20px">
            <a
              href="mailto:{EMAIL}"
              style="color: #0d2030; text-decoration: none"
            >{EMAIL}</a>
            <span style="color: #9aabb4"> · </span>
            <a
              href="https://corrovera.com"
              style="color: #13866f; text-decoration: none"
            >corrovera.com</a>
          </div>
          <div style="color: #627d8a; font-size: 11px; line-height: 18px">
            Independent minds. Corroborated truth.
          </div>
        </td>
      </tr>
    </table>
  </body>
</html>
