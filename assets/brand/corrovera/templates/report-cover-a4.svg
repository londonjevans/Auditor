<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" role="img" aria-labelledby="title desc">
  <title id="title">Corrovera Security Assurance Report cover</title>
  <desc id="desc">Editable A4 cover template with placeholders for client, scope, dates, version, and classification.</desc>
  <rect width="1240" height="1754" fill="#08131E"/>
  <g opacity=".22" fill="none" stroke="#365163">
    <path d="M0 190H1240M0 520H1240M0 850H1240M0 1180H1240M0 1510H1240"/>
    <path d="M160 0V1754M490 0V1754M820 0V1754M1150 0V1754"/>
  </g>
  <g transform="translate(80 72) scale(.52)">
    <path d="M10 10h15l47 47-15 15z" fill="#2CE0C2"/>
    <path d="M103 10h15L71 57 56 72z" fill="#5BD7DB"/>
    <path d="M10 118h15l47-47-15-15z" fill="#3155C6"/>
    <path d="M103 118h15L71 71 56 56z" fill="#5870FF"/>
    <path d="M64 40 88 64 64 88 40 64z" fill="#D9E4E8"/>
    <circle cx="64" cy="64" r="4" fill="#08131E"/>
  </g>
  <text x="166" y="113" fill="#F6F4EE" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="650" letter-spacing="7">CORROVERA</text>
  <text x="168" y="145" fill="#9EB6C2" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="650" letter-spacing="6">SECURITY</text>

  <text x="80" y="354" fill="#2CE0C2" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="500" letter-spacing="3">INDEPENDENT SECURITY ASSESSMENT</text>
  <text x="76" y="455" fill="#F6F4EE" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="82" font-weight="600" letter-spacing="-2">SECURITY</text>
  <text x="76" y="548" fill="#F6F4EE" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="82" font-weight="600" letter-spacing="-2">ASSURANCE</text>
  <text x="76" y="641" fill="#F6F4EE" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="82" font-weight="600" letter-spacing="-2">REPORT</text>

  <path d="M80 718h520" stroke="#2CE0C2" stroke-width="3"/>
  <text x="80" y="784" fill="#D9E4E8" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" font-size="17" letter-spacing="2">CLIENT / PROTOCOL</text>
  <text x="80" y="842" fill="#FFFFFF" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="42" font-weight="550">{CLIENT_OR_PROTOCOL}</text>
  <text x="80" y="914" fill="#9EB6C2" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24">{ASSESSMENT_SCOPE}</text>

  <g transform="translate(80 1040)">
    <text y="0" fill="#9EB6C2" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" font-size="15" letter-spacing="2">ASSESSMENT WINDOW</text>
    <text y="42" fill="#F6F4EE" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23">{START_DATE} — {END_DATE}</text>
    <text x="410" y="0" fill="#9EB6C2" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" font-size="15" letter-spacing="2">REPORT VERSION</text>
    <text x="410" y="42" fill="#F6F4EE" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23">{VERSION}</text>
  </g>

  <g transform="translate(80 1194)">
    <rect width="278" height="52" rx="4" fill="#0D2030" stroke="#E7B75F"/>
    <circle cx="26" cy="26" r="6" fill="#E7B75F"/>
    <text x="48" y="33" fill="#F6F4EE" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="600" letter-spacing="2">{CLASSIFICATION}</text>
  </g>

  <g transform="translate(835 1235)">
    <g fill="none" stroke-linecap="square">
      <circle cx="170" cy="170" r="152" stroke="#365163" stroke-width="2"/>
      <circle cx="170" cy="170" r="106" stroke="#365163" stroke-width="2"/>
      <path d="M-45-45 182 182" stroke="#2CE0C2" stroke-width="22" opacity=".72"/>
      <path d="m385-45-227 227" stroke="#5BD7DB" stroke-width="22" opacity=".64"/>
      <path d="m-45 385 227-227" stroke="#3155C6" stroke-width="22" opacity=".72"/>
