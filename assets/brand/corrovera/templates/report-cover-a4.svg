  </g>

  <text x="80" y="1660" fill="#D9E4E8" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="500">Independent minds. Corroborated truth.</text>
  <text x="1160" y="1660" text-anchor="end" fill="#2CE0C2" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" font-size="18">corrovera.com</text>
  <path d="M80 1698h1080" stroke="#365163"/>
  <text x="80" y="1730" fill="#627D8A" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" font-size="12">REPORT ID {REPORT_ID} · SHA-256 {REPORT_HASH}</text>
</svg>
