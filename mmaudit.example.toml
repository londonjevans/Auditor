[models.verifier]
primary = "PROVIDER_E/MODEL_ID_E"
fallbacks = []

[models.judge]
primary = "PROVIDER_F/MODEL_ID_F"
fallbacks = []

# Maximum-assurance requires every specialist responsibility below. Replace each placeholder with
# an exact operator-reviewed model ID; use genuinely independent families and set quality tiers
# according to your own capability evaluation rather than vendor marketing.
[models.specialists.access_control]
primary = "PROVIDER_G/MODEL_ACCESS_CONTROL"
fallbacks = []
quality_tier = "high"
capabilities = ["structured_json", "security_reasoning", "solidity"]

