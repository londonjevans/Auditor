required = false
# database_path = ".mmaudit/codeql/database"
# query_suite = "security-extended"

[scanners.slither]
enabled = false
required = false

[scanners.foundry_fork]
enabled = false
required = false
# Legacy path for pre-existing test/audit/*.t.sol suites. Candidate-specific generated fork
# reproduction is controlled by [reproduction] and is the default Solidity evidence gate.

[scanners.hardhat_fork]
enabled = false
required = false

[reporting]
