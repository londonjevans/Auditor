[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "mmaudit"
version = "0.1.0"
description = "Corrovera's Solidity/EVM security auditor with reduced generic source review"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Corrovera Security" }]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "hatchling>=1.25,<2",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
mmaudit = "mmaudit.cli:app"
mmaudit-hardhat-loopback = "mmaudit.isolation.hardhat_loopback_relay:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mmaudit"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "large_scale: deterministic realistic-size fixture and analysis regressions",
  "slow: bounded tests intended for separate slow-suite selection",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mmaudit"]
exclude = ["tests/fixtures"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["typer.*"]
ignore_missing_imports = true
